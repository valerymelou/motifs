<section [id]="copy.id" class="rim" aria-labelledby="rim-title">
  <div class="stage">
    <!-- The slope at dawn: a landscape frame from 40rem, an upright crop of
         its phone twin below. The page's largest paint, so it loads first. -->
    <picture class="scene">
      <source
        media="(min-width: 40rem)"
        [attr.srcset]="photos.wide"
        sizes="100vw"
      />
      <img
        [src]="photos.fallback"
        [srcset]="photos.tall"
        sizes="100vw"
        [alt]="copy.sceneLabel"
        fetchpriority="high"
        decoding="async"
      />
    </picture>
    <div class="scrim" aria-hidden="true"></div>
    <div class="mist" aria-hidden="true"></div>
    <div class="map" aria-hidden="true"></div>

    <div class="copy">
      <h1 id="rim-title" class="name">
        <!-- The space stays inside the span: Angular drops whitespace
             between elements, and the name would read as one word. -->
        <span class="name-main">{{ copy.name[0] + ' ' }}</span>
        <span class="name-sub">{{ copy.name[1] }}</span>
      </h1>
      <p class="tagline">{{ copy.tagline }}</p>
      <div class="actions">
        <a ndButton size="lg" class="action" [href]="copy.shop.href">{{
          copy.shop.label
        }}</a>
        <a
          ndButton
          size="lg"
          variant="outline"
          class="action ghost"
          [href]="copy.walk.href"
          >{{ copy.walk.label }}</a
        >
      </div>
    </div>
  </div>
</section>
