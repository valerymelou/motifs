<header class="site-header">
  <a class="wordmark" [href]="copy.home">{{ copy.name }}</a>
  <button type="button" class="dial" popovertarget="sections-menu">
    <span class="dial-label">{{ copy.circle }}<br />{{ copy.year }}</span
    ><span class="sr-only">, {{ copy.menu }}</span>
    <svg viewBox="0 0 46 46" aria-hidden="true">
      <circle class="face" cx="23" cy="23" r="21.5" />
      @for (mark of marks; track mark.id) {
        <circle
          class="mark"
          [attr.data-section]="mark.id"
          [attr.cx]="mark.x"
          [attr.cy]="mark.y"
          r="2.2"
        />
      }
      <g class="hand">
        <line x1="23" y1="23" x2="23" y2="11" />
        <circle cx="23" cy="23" r="3" />
      </g>
    </svg>
  </button>
</header>

<div #menu id="sections-menu" popover class="sections-menu">
  <nav [attr.aria-label]="copy.menu">
    <ol>
      @for (section of sections; track section.id; let i = $index) {
        <li [style.--i]="i">
          <a [href]="'#' + section.id" (click)="close()">
            <small>{{ section.note }}</small>
            {{ section.label }}
          </a>
        </li>
      }
    </ol>
  </nav>
  <button
    type="button"
    class="close"
    popovertarget="sections-menu"
    popovertargetaction="hide"
  >
    {{ copy.close }}
  </button>
</div>
