<section id="code" class="scroll-mt-4">
  <div class="mx-auto grid max-w-6xl gap-12 px-4 py-20 sm:px-8 sm:py-28">
    <div class="grid max-w-2xl gap-4">
      <p
        class="font-mono text-xs tracking-[0.16em] text-muted-foreground uppercase"
      >
        {{ copy.label }}
      </p>
      <h2
        class="text-[clamp(2rem,4.5vw,3.25rem)] leading-[1] font-extrabold tracking-[-0.035em]"
      >
        {{ copy.title }}
      </h2>
      <p class="text-lg leading-relaxed text-muted-foreground">
        {{ copy.lead }}
      </p>
    </div>
    @for (sample of copy.samples; track sample.task) {
      <article
        class="grid gap-5 lg:grid-cols-[minmax(0,0.8fr)_minmax(0,1.6fr)] lg:gap-12"
      >
        <div class="grid content-start gap-2">
          <h3 class="text-xl font-bold tracking-tight">{{ sample.title }}</h3>
          <p class="leading-relaxed text-muted-foreground">{{ sample.text }}</p>
        </div>
        <mt-code-sample
          class="min-w-0"
          [task]="sample.task"
          [title]="sample.title"
          [sendable]="sample.sendable"
        />
      </article>
    }
  </div>
</section>
