<footer class="border-t border-border">
  <div class="thread thread-end mx-auto grid max-w-6xl gap-8 pt-12">
    <!-- The thread ends here, in the stitch the index gives Fil. -->
    <svg class="stitch" viewBox="0 0 48 48" aria-hidden="true">
      <path
        fill="currentColor"
        fill-rule="evenodd"
        d="M2 22h14v4H2Z M32 22h14v4H32Z M22 6h4v12h-4Z M22 30h4v12h-4Z"
      />
    </svg>
    <div class="flex flex-wrap items-baseline justify-between gap-4">
      <p class="text-3xl font-extrabold tracking-[-0.04em]">{{ copy.name }}</p>
      <p class="font-mono text-sm text-muted-foreground">{{ copy.place }}</p>
    </div>
    <mt-series-footer slug="fil" [name]="copy.name" />
  </div>
</footer>
