<section id="coverage" class="scroll-mt-4 border-t border-border">
  <div class="thread mx-auto grid max-w-6xl gap-12 py-20 sm:py-28">
    <div class="grid max-w-2xl gap-4">
      <p
        class="font-mono text-xs tracking-[0.16em] text-muted-foreground uppercase"
      >
        {{ copy.label }}
      </p>
      <h2
        class="text-[clamp(2rem,4.5vw,3.25rem)] leading-[1] font-extrabold tracking-[-0.035em]"
      >
        {{ copy.title }}
      </h2>
      <p class="text-lg leading-relaxed text-muted-foreground">
        {{ copy.lead }}
      </p>
    </div>
    <ul class="grid gap-10">
      @for (region of copy.regions; track region.id) {
        <li class="knot grid gap-3 lg:grid-cols-[14rem_minmax(0,1fr)] lg:gap-8">
          <h3 class="text-xl font-bold tracking-tight">{{ region.name }}</h3>
          <ul class="flex flex-wrap gap-2">
            @for (country of region.countries; track country.code) {
              <li
                class="inline-flex items-baseline gap-2 rounded-full border border-border px-3 py-1 text-sm"
              >
                {{ country.name }}
                <span class="font-mono text-xs text-muted-foreground">{{
                  country.code
                }}</span>
              </li>
            }
          </ul>
        </li>
      }
    </ul>
    <p class="text-sm text-muted-foreground">{{ copy.note }}</p>
  </div>
</section>
