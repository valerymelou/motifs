<section
  id="motifs"
  class="mx-auto max-w-7xl scroll-mt-6 px-4 py-24 sm:px-8 sm:py-32"
>
  <div class="grid gap-10 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-end">
    <div>
      <p
        class="font-mono text-xs tracking-[0.2em] text-muted-foreground uppercase"
      >
        {{ copy.label }}
      </p>
      <h2
        class="mt-6 font-serif text-[clamp(2.75rem,6vw,5.5rem)] leading-[0.92] tracking-[-0.01em]"
      >
        {{ copy.title }}<br />
        <em class="italic">{{ copy.titleEmphasis }}</em>
      </h2>
      <p class="mt-6 max-w-xl text-lg leading-relaxed text-muted-foreground">
        {{ copy.lead }}
      </p>
    </div>
    <div
      ndToggleGroup
      variant="outline"
      [spacing]="1"
      class="flex-wrap"
      [attr.aria-label]="copy.filterLabel"
      [(value)]="selected"
    >
      @for (filter of filters; track filter.mood) {
        <button ndToggleGroupItem [value]="filter.mood" class="gap-2">
          {{ copy.moods[filter.mood] }}
          <span class="font-mono text-xs text-muted-foreground">{{
            filter.count
          }}</span>
        </button>
      }
    </div>
  </div>
  <p class="sr-only" aria-live="polite">{{ summary() }}</p>
  <ul
    class="mt-14 grid gap-x-6 gap-y-14 sm:grid-cols-2 lg:grid-cols-3"
    mtStagger="80"
  >
    @for (entry of entries(); track entry.page.slug) {
      <li mtReveal [id]="entry.page.slug" class="scroll-mt-6">
        <mt-page-card [page]="entry.page" [number]="entry.number" />
      </li>
    }
  </ul>
</section>
