<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Motifs</title>
    <meta
      name="description"
      content="Twelve landing pages for fictional brands, built with Angular and Ndop UI."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      The headline's face is declared here, not in theme.css: the build
      defers the full stylesheet, so a face declared there would apply only
      after it loads, late for the page's largest paint. It isn't preloaded:
      in testing, preloading made the first paint slower and less steady.
    -->
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/instrument-serif-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Instrument Serif';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/instrument-serif-latin-400-italic.woff2')
          format('woff2');
      }
    </style>
  </head>
  <body>
    <mt-root></mt-root>
  </body>
</html>
