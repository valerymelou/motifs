<svg
  [attr.viewBox]="viewBox()"
  role="img"
  [attr.aria-label]="label()"
  class="block h-auto w-full"
>
  <!-- Before the vat: white cotton, each motif outlined in raffia stitches. -->
  <rect width="100%" height="100%" fill="#F6F1E6" />
  @for (placement of placements(); track $index) {
    <g
      [attr.transform]="placement.transform"
      fill="none"
      stroke="#A9843F"
      stroke-width="1.4"
      stroke-dasharray="3 2.5"
      stroke-linecap="round"
    >
      <path
        [attr.d]="placement.motif.path"
        vector-effect="non-scaling-stroke"
      />
      @if (placement.motif.lines) {
        <path
          [attr.d]="placement.motif.lines"
          vector-effect="non-scaling-stroke"
        />
      }
    </g>
  }

  <!-- After it: the ground turns vat green, then indigo; the motifs stay
       raw cotton where the raffia kept the dye out. -->
  <g class="dyed" [class.shown]="dyed()">
    <rect width="100%" height="100%" fill="#3E6A5A" />
    <rect class="indigo" width="100%" height="100%" [attr.fill]="indigo()" />
    @for (placement of placements(); track $index) {
      <g [attr.transform]="placement.transform" fill="#F3EEE2">
        <path [attr.d]="placement.motif.path" fill-rule="evenodd" />
        @if (placement.motif.lines) {
          <path
            [attr.d]="placement.motif.lines"
            fill="none"
            stroke="#F3EEE2"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        }
      </g>
    }
  </g>

  <!-- Where the narrow woven strips were sewn together. -->
  @for (seam of layout().seams; track seam) {
    <line
      [attr.x1]="seam"
      [attr.x2]="seam"
      y1="0"
      [attr.y2]="layout().height"
      stroke="#000000"
      stroke-opacity="0.07"
      stroke-width="1.5"
    />
  }
</svg>
