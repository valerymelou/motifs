<!-- Skipped until near the screen: on slow connections Chrome fetches lazy
     images up to 2500px ahead, which would take bandwidth from the hero.
     The fixed proportions keep the skipped box at its real size. -->
<div
  class="relative overflow-hidden"
  [class.[content-visibility:auto]]="!priority()"
  [style.aspect-ratio]="ratio()"
>
  @if (fallback(); as src) {
    <img
      [src]="src"
      [srcset]="srcset()"
      [sizes]="sizes()"
      [alt]="alt()"
      [attr.loading]="priority() ? 'eager' : 'lazy'"
      [attr.fetchpriority]="priority() ? 'high' : 'auto'"
      decoding="async"
      class="absolute inset-0 size-full object-cover"
      [style.object-position]="focus()"
    />
  } @else {
    <div
      class="absolute inset-0 grid place-items-center bg-muted p-4 text-center"
      role="img"
      [attr.aria-label]="alt()"
    >
      <span aria-hidden="true" class="text-xs text-muted-foreground"
        >Photo to come: {{ name() }}</span
      >
    </div>
  }
</div>
