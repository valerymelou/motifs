name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request replaces its running checks; master always
  # finishes, so every merge is checked and deployed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs, since the deploy jobs hold a token.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: master
      - run: pnpm exec playwright install --with-deps chromium

      - name: Format
        run: pnpm nx format:check --all
      - name: Lint, test, build, and e2e with axe
        run: pnpm nx affected -t lint test build e2e
      # Builds every page, assembles dist/site and checks each page against
      # the quality bar. The preview and deploy jobs publish that same site.
      - name: Lighthouse
        run: pnpm nx run workspace-plugin:lighthouse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/site
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore

  # Pull requests from forks get no secrets, so they keep the site artifact
  # as their preview.
  preview:
    name: Preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The lockfile pins Wrangler's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/site
      # Any branch other than master is a preview on Cloudflare Pages, with its
      # own URL that follows the branch. The branch name goes through the
      # environment, not the script, since a pull request chooses it.
      - name: Deploy a preview to Cloudflare Pages
        id: deploy
        run: |
          pnpm exec wrangler pages deploy dist/site --project-name=motifs \
            --branch="$BRANCH" --commit-hash="$COMMIT"
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://motifs.valerymelou.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The lockfile pins Wrangler's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/site
      # master is the Pages project's production branch, served at
      # motifs.valerymelou.com.
      - name: Deploy to Cloudflare Pages
        run: >-
          pnpm exec wrangler pages deploy dist/site --project-name=motifs
          --branch=master --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
